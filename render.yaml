services:
  - type: web
    name: kavasam-consent-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./cloud/Dockerfile
    dockerContext: ./cloud
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ACTIAN_VECTORAI_URL
        sync: false
      - key: ACTIAN_VECTORAI_ACCESS_TOKEN
        sync: false
      - key: ACTIAN_VECTORAI_COLLECTION
        value: kavasam_scam_patterns
      - key: ACTIAN_VECTORAI_TIMEOUT_SECONDS
        value: "2.5"
      - key: NUMBER_HMAC_SECRET
        generateValue: true
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        sync: false
      - key: SNOWFLAKE_DATABASE
        sync: false
      - key: SNOWFLAKE_SCHEMA
        sync: false
      - key: SNOWFLAKE_ROLE
        sync: false
      - key: SNOWFLAKE_PRIVATE_KEY_B64
        sync: false
      - key: SNOWFLAKE_PRIVATE_KEY_PASSPHRASE
        sync: false
      - key: KAVASAM_DB_PATH
        value: /tmp/kavasam.db
